services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: ib-gateway
    restart: always
    env_file:
      - .env
    ports:
      - "4002:4004"
      - "5900:5900"
    environment:
      - TWS_USERID=${TWS_USERID}
      - TWS_PASSWORD=${TWS_PASSWORD}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - TWS_ACCEPT_EULA=${TWS_ACCEPT_EULA:-yes}
      - VNC_SERVER_PASSWORD=${VNC_PASSWORD:-ibgateway}
      - READ_ONLY_API=${READ_ONLY_API:-no}
      - API_PORT=4002
      - SOCAT_PORT=4004
      - IBC_INI=/home/ibgateway/ibc/config.ini
      - IBC_PATH=/home/ibgateway/ibc
      - TWS_PATH=/home/ibgateway/Jts
      - LOG_PATH=/home/ibgateway/logs
    volumes:
      - ./ibc/config.ini.tmpl:/home/ibgateway/ibc/config.ini.tmpl
      - ./ibc/config.ini:/home/ibgateway/ibc/config.ini
      - ./logs:/home/ibgateway/logs

  ib-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ib-proxy
    restart: unless-stopped
    depends_on:
      - ib-gateway
    env_file:
      - .env
    environment:
      - IB_HOST=ib-gateway
      - IB_API_PORT=4004
      - IB_CLIENT_ID=${IB_CLIENT_ID:-99}
      - ZMQ_PUB_PORT=${ZMQ_PUB_PORT:-5555}
      - ZMQ_REP_PORT=${ZMQ_REP_PORT:-5556}
      - IB_SYMBOLS=${IB_SYMBOLS:-AAPL,FX:USDCNH,CRYPTO:BTC}
      - IB_ORDER_OWNERSHIP_DB_PATH=/app/data/ib_order_ownership.sqlite3
    ports:
      - "${ZMQ_PUB_PORT:-5555}:5555"
      - "${ZMQ_REP_PORT:-5556}:5556"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
